<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Poloha</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');
  :root {
    --bg: #0a0e1a; --panel: #111827; --border: #1e2d45;
    --accent: #00e5ff; --accent2: #ff6b35; --green: #00ff9d;
    --text: #e2e8f0; --muted: #4a5568;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; }

  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .header-text h1 { font-size: 16px; font-weight: 800; }
  .header-text h1 span { color: var(--accent); }
  .header-text p { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: 1px; }

  #map { flex: 1; width: 100%; }

  .info-bar { background: var(--panel); border-top: 1px solid var(--border); padding: 14px 16px; flex-shrink: 0; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .info-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .info-card.wide { grid-column: 1 / -1; }
  .info-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .info-value { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; color: var(--accent); }
  .info-value.green  { color: var(--green); }
  .info-value.orange { color: var(--accent2); }
  .info-value.small  { font-size: 13px; }

  .nav-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--accent), #0099bb);
    border: none; border-radius: 10px; color: #000;
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800;
    cursor: pointer; text-decoration: none; display: block; text-align: center;
  }

  .leaflet-container { background: #1a2035; }
  .leaflet-control-zoom { border: 1px solid var(--border) !important; }
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }

  .error { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:32px; text-align:center; }
  .error h2 { font-size: 20px; color: var(--accent); }
  .error p { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo-icon">📍</div>
  <div class="header-text">
    <h1>GPS <span>Poloha</span></h1>
    <p id="headerSub">Sdílená poloha</p>
  </div>
</header>

<div id="map"></div>
<div id="errorDiv" class="error" style="display:none">
  <h2>😕 Poloha nenalezena</h2>
  <p>Odkaz je neplatný nebo poškozený.<br>Požádej o nový odkaz.</p>
</div>

<div class="info-bar" id="infoBar">
  <div class="info-grid">
    <div class="info-card">
      <div class="info-label">Datum</div>
      <div class="info-value small" id="infoDate">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Čas</div>
      <div class="info-value green" id="infoTime">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Rychlost</div>
      <div class="info-value orange" id="infoSpeed">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Přesnost GPS</div>
      <div class="info-value small" id="infoAcc">—</div>
    </div>
    <div class="info-card wide">
      <div class="info-label">Souřadnice</div>
      <div class="info-value small" id="infoCoords">—</div>
    </div>
  </div>
  <a id="navBtn" class="nav-btn" target="_blank">Navigovat sem v Google Maps</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const lat = parseFloat(params.get('lat'));
  const lon = parseFloat(params.get('lon'));
  const cas = params.get('cas') || '—';
  const dat = params.get('dat') || '—';
  const spd = params.get('spd') || '—';
  const acc = params.get('acc') || '—';

  if (isNaN(lat) || isNaN(lon)) {
    document.getElementById('map').style.display     = 'none';
    document.getElementById('infoBar').style.display  = 'none';
    document.getElementById('errorDiv').style.display = 'flex';
  } else {
    const map = L.map('map', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    map.setView([lat, lon], 15);

    // Marker
    L.circleMarker([lat, lon], {
      radius: 10, fillColor: '#00e5ff', color: 'white', weight: 3, fillOpacity: 1
    }).addTo(map).bindPopup(`<b>📍 ${dat}</b><br>${cas}<br>${spd}`).openPopup();

    // Kruh přesnosti
    const meters = parseFloat(acc);
    if (!isNaN(meters)) {
      L.circle([lat, lon], {
        radius: meters, color: '#00e5ff', fillColor: '#00e5ff', fillOpacity: 0.08, weight: 1
      }).addTo(map);
    }

    document.getElementById('headerSub').textContent  = `${dat} v ${cas}`;
    document.getElementById('infoDate').textContent   = dat;
    document.getElementById('infoTime').textContent   = cas;
    document.getElementById('infoSpeed').textContent  = spd;
    document.getElementById('infoAcc').textContent    = acc;
    document.getElementById('infoCoords').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    document.getElementById('navBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
  }
</script>
</body>
</html>
